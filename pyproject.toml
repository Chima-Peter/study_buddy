[project]
name = "study_buddy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.6.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "dependency-injector>=4.49.1",
    "docx>=0.2.4",
    "elasticsearch==8.15.0",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.139.0",
    "httpx2>=2.5.0",
    "jq>=1.12.0",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.2.7",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langsmith>=0.10.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.1",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "supabase>=2.31.0",
    "unstructured-client>=0.45.0",
    "unstructured[all-docs,pdf]>=0.24.1",
    "uuid-utils>=0.16.2",
    "uvicorn[standard]>=0.50.2",
    "websockets>=15.0.1",
]

[tool.pylint.typecheck]
# Members these packages expose can't be seen by static analysis:
# - alembic.op attaches execute/create_table/... at runtime
# - dependency_injector is a compiled C extension (containers/providers.*)
ignored-modules = ["alembic.op", "dependency_injector"]
