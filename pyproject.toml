[project]
name = "study_buddy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.6.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dependency-injector>=4.49.1",
    "elasticsearch==8.15.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.7",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "supabase>=2.31.0",
    "unstructured[all-docs,pdf]>=0.24.1",
    "uuid-utils>=0.16.2",
    "uvicorn[standard]>=0.50.2",
    "websockets>=15.0.1",
]

[tool.pylint.typecheck]
# Members these packages expose can't be seen by static analysis:
# - alembic.op attaches execute/create_table/... at runtime
# - dependency_injector is a compiled C extension (containers/providers.*)
ignored-modules = ["alembic.op", "dependency_injector"]
