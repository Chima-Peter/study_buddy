  #     retries: 10
  #     start_period: 30s
  #   depends_on:
  #     supabase-db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     elasticsearch:
  #       condition: service_healthy
  #     unstructured:
  #       condition: service_healthy
  #     supabase-kong:
  #       condition: service_started
